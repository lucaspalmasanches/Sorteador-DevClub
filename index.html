<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Sorteador DevClub</title>
</head>

<body>

    <div class="main-container">
        <img src="./assets/sort.png" alt="Logo DevSorteio">

        <h2>Sortear um número</h2>

        <div class="input-group">
            <input id="input-min" placeholder="entre" type="number">

            <input id="input-max" placeholder="e" type="number">
        </div>

        <p id="result-display"></p> 

        <button id="sort-button">Sortear</button>
    </div>

</body>
<script src="script.js"></script>

</html>
